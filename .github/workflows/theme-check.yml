name: Theme Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: theme-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    env:
      CI: "true"
      SHOPIFY_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the job on Theme Check errors (warnings are reported but do not fail).
      - name: Run Theme Check
        run: npm run check
